

<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"

    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#201a38">

  <title>ちりんちりんアイス｜10秒チャレンジ</title>

  <style>

    :root {

      --bg: #201a38;

      --card: #30284e;

      --gold: #ffda81;

      --white: #ffffff;

      --muted: #d3cbe5;

    }

    * {

      box-sizing: border-box;

      -webkit-tap-highlight-color: transparent;

    }

    body {

      margin: 0;

      min-height: 100svh;

      background: radial-gradient(

        circle at top, #473269, var(--bg) 70%

      );

      color: var(--white);

      font-family: -apple-system, BlinkMacSystemFont,

        "Hiragino Kaku Gothic ProN", sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

    }

    .container {

      width: 100%;

      max-width: 460px;

      padding: 28px 20px;

    }

    .subtitle {

      color: var(--gold);

      font-size: 14px;

      font-weight: bold;

      letter-spacing: 2px;

    }

    h1 {

      font-size: clamp(29px, 8vw, 38px);

      margin: 14px 0;

      font-weight: 900;

    }

    .description {

      color: var(--muted);

      font-size: 15px;

      line-height: 1.8;

      min-height: 54px;

    }

    .watch {

      margin: 25px 0;

      padding: 32px 10px;

      background: var(--card);

      border: 2px solid #74608f;

      border-radius: 25px;

      box-shadow: 0 12px 30px #0003;

    }

    .time-label {

      color: var(--gold);

      font-size: 13px;

      letter-spacing: 3px;

    }

    #time {

      font-size: clamp(65px, 19vw, 90px);

      font-weight: 900;

      font-variant-numeric: tabular-nums;

      letter-spacing: -3px;

      margin: 12px 0;

      white-space: nowrap;

    }

    .seconds {

      color: var(--muted);

      font-size: 14px;

      letter-spacing: 2px;

    }

    #result {

      min-height: 120px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 12px;

    }

    #resultTitle {

      font-size: 34px;

      font-weight: 900;

    }

    #resultPrize {

      font-size: 18px;

      font-weight: bold;

      line-height: 1.6;

    }

    button {

      width: 100%;

      min-height: 76px;

      border: 0;

      border-radius: 20px;

      font-size: 25px;

      font-weight: 900;

      cursor: pointer;

      touch-action: manipulation;

    }

    #mainButton {

      background: var(--gold);

      color: #2e2341;

      box-shadow: 0 6px 0 #ac8741;

    }

    #mainButton:active {

      transform: translateY(4px);

      box-shadow: 0 2px 0 #ac8741;

    }

    #resetButton {

      background: transparent;

      border: 2px solid #8779a0;

      color: white;

      font-size: 18px;

      min-height: 58px;

      margin-top: 15px;

      display: none;

    }

    .note {

      color: var(--muted);

      font-size: 12px;

      line-height: 1.8;

      margin-top: 28px;

    }

    .jackpot {

      color: #ffda65;

      animation: pop 0.6s ease;

    }

    .win {

      color: #9bffb3;

      animation: pop 0.5s ease;

    }

    .lose {

      color: #dfd6ef;

    }

    @keyframes pop {

      0% { transform: scale(0.5); opacity: 0; }

      65% { transform: scale(1.12); }

      100% { transform: scale(1); opacity: 1; }

    }

    .confetti {

      position: fixed;

      top: -25px;

      width: 9px;

      height: 16px;

      pointer-events: none;

      animation: fall linear forwards;

    }

    @keyframes fall {

      to {

        transform: translateY(110svh) rotate(720deg);

        opacity: 0;

      }

    }

    @media (prefers-reduced-motion: reduce) {

      .jackpot, .win, .confetti {

        animation: none;

      }

    }

  </style>

</head>

<body>

  <main class="container">

    <div class="subtitle">11月限定 LINEクーポン</div>

    <h1>10秒チャレンジ！</h1>

    <p class="description" id="description">

      10秒ぴったりを目指そう！<br>

      3秒以降は時間が見えなくなるよ！

    </p>

    <div class="watch">

      <div class="time-label">YOUR TIME</div>

      <div id="time">00.0</div>

      <div class="seconds">SECONDS</div>

    </div>

    <div id="result" aria-live="polite">

      <div id="resultTitle">準備はいい？</div>

      <div id="resultPrize">

        スタートを押してチャレンジ！

      </div>

    </div>

    <button id="mainButton" type="button">

      スタート！

    </button>

    <button id="resetButton" type="button">

      最初に戻る

    </button>

    <p class="note">

      お会計時にLINEクーポンをご提示ください。<br>

      スタッフ立ち会いのもと、1回チャレンジできます。<br>

      50円引きは1会計につき1回限りです。

    </p>

  </main>

  <script>

    "use strict";

    const timeEl = document.getElementById("time");

    const descriptionEl =

      document.getElementById("description");

    const resultTitle =

      document.getElementById("resultTitle");

    const resultPrize =

      document.getElementById("resultPrize");

    const mainButton =

      document.getElementById("mainButton");

    const resetButton =

      document.getElementById("resetButton");

    let state = "ready";

    let startTime = 0;

    let animationId = null;

    // 秒数を小数点第1位まで表示

    function formatTime(ms) {

      const tenths = Math.round(ms / 100);

      const seconds = (tenths / 10).toFixed(1);

      return seconds.padStart(4, "0");

    }

    // 計測中の画面更新

    function updateTimer() {

      if (state !== "running") return;

      const elapsed = performance.now() - startTime;

      if (elapsed < 3000) {

        timeEl.textContent = formatTime(elapsed);

      } else {

        timeEl.textContent = "??.?";

      }

      animationId = requestAnimationFrame(updateTimer);

    }

    function startGame() {

      if (state !== "ready") return;

      state = "running";

      timeEl.textContent = "00.0";

      resultTitle.textContent = "";

      resultPrize.textContent = "";

      descriptionEl.innerHTML =

        "時間は秘密！<br>10秒だと思ったらストップ！";

      mainButton.textContent = "ストップ！";

      mainButton.style.background = "#ff8a95";

      mainButton.style.boxShadow =

        "0 6px 0 #ae4b5d";

      startTime = performance.now();

      animationId = requestAnimationFrame(updateTimer);

    }

    function stopGame() {

      if (state !== "running") return;

      const elapsed = performance.now() - startTime;

      state = "finished";

      cancelAnimationFrame(animationId);

      // 表示値で判定する

      const tenths = Math.round(elapsed / 100);

      timeEl.textContent = formatTime(elapsed);

      mainButton.style.display = "none";

      resetButton.style.display = "block";

      descriptionEl.textContent =

        "チャレンジ結果発表！";

      resultTitle.className = "";

      if (tenths === 100) {

        resultTitle.textContent = "大当たり！！";

        resultTitle.className = "jackpot";

        resultPrize.textContent =

          "シングルアイス1個プレゼント！";

        launchConfetti();

      } else if (tenths >= 95 && tenths <= 105) {

        resultTitle.textContent = "当たり！";

        resultTitle.className = "win";

        resultPrize.textContent =

          "お会計から50円引き！";

      } else {

        resultTitle.textContent = "残念！";

        resultTitle.className = "lose";

        resultPrize.textContent =

          "またチャレンジしてね！";

      }

    }

    function resetGame() {

      cancelAnimationFrame(animationId);

      document.querySelectorAll(".confetti")

        .forEach(el => el.remove());

      state = "ready";

      startTime = 0;

      timeEl.textContent = "00.0";

      resultTitle.className = "";

      resultTitle.textContent = "準備はいい？";

      resultPrize.textContent =

        "スタートを押してチャレンジ！";

      descriptionEl.innerHTML =

        "10秒ぴったりを目指そう！<br>" +

        "3秒以降は時間が見えなくなるよ！";

      mainButton.textContent = "スタート！";

      mainButton.style.display = "block";

      mainButton.style.background = "";

      mainButton.style.boxShadow = "";

      resetButton.style.display = "none";

    }

    function launchConfetti() {

      const colors = [

        "#ffda65", "#ffffff", "#ff8fa3",

        "#a5e7ff", "#a9ffb5"

      ];

      for (let i = 0; i < 65; i++) {

        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.style.left = Math.random() * 100 + "vw";

        piece.style.background =

          colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDuration =

          (2 + Math.random() * 2) + "s";

        piece.style.animationDelay =

          Math.random() * 0.5 + "s";

        document.body.appendChild(piece);

        piece.addEventListener("animationend", () => {

          piece.remove();

        }, { once: true });

      }

    }

    mainButton.addEventListener("click", () => {

      if (state === "ready") {

        startGame();

      } else if (state === "running") {

        stopGame();

      }

    });

    resetButton.addEventListener("click", resetGame);

  </script>

</body>

</html>
